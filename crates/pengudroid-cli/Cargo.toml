[package]
name = "pengudroid-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `pengudroid` command: run APKs, manage the daemon."

[[bin]]
name = "pengudroid"
path = "src/main.rs"

[dependencies]
pengudroid-input.workspace = true
pengudroid-proto.workspace = true
pengudroid-socket.workspace = true
pengudroid-elf.workspace = true
pengudroid-hostgpu.workspace = true
pengudroid-nativebridge.workspace = true
pengudroid-daemon.workspace = true
libc.workspace = true
wayland-client = { workspace = true, optional = true }
wayland-scanner = { version = "0.31.7", optional = true }
wayland-backend = { version = "0.3", optional = true }
wayland-egl = { version = "0.32", optional = true }
miniz_oxide.workspace = true
roxmltree = "0.21.2"

[features]
# The `pengudroid` binary (desktop and the release packaging) enables these;
# pengudroid-gui links the library only to dispatch CLI commands and does not
# need the Wayland probe machinery.
default = ["wlegl-probe"]
wlegl-probe = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-scanner", "dep:wayland-egl"]

[lib]
name = "pengudroid_cli"
path = "src/lib.rs"

[dev-dependencies]
pengudroid-proto.workspace = true
pengudroid-socket.workspace = true
