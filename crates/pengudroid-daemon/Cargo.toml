[package]
name = "pengudroid-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PenguDroid background daemon (binder/graphics/audio broker)."

[lib]
name = "pengudroid_daemon"
path = "src/lib.rs"

[[bin]]
name = "pengudroid-daemon"
path = "src/main.rs"

[dependencies]
pengudroid-proto.workspace = true
pengudroid-input.workspace = true
pengudroid-device.workspace = true
pengudroid-socket.workspace = true
pengudroid-hostgpu.workspace = true
libc.workspace = true
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-scanner = { version = "0.31.7", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
wayland-egl = { version = "0.32", optional = true }
zbus = { version = "5.19", features = ["p2p"], optional = true }

smithay-client-toolkit = { version = "0.19.2", default-features = false, optional = true }
sctk-adwaita = { version = "0.10.1", optional = true }

[features]
default = ["wayland"]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-scanner", "dep:wayland-backend", "dep:zbus", "dep:smithay-client-toolkit", "dep:sctk-adwaita"]
